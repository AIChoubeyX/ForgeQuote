name: ForgeQuote CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test Backend & Build Frontend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forgequote
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/forgequote
      JWT_SECRET: ci-test-jwt-secret-key-at-least-32-chars
      CLIENT_ORIGIN: http://localhost:5173
      GROQ_API_KEY: gsk_mock_test_key_for_unit_tests
      GROQ_MODEL: openai/gpt-oss-20b
      COMPANY_NAME: ForgeQuote CI
      COMPANY_ADDRESS: CI Pipeline Test Address
      QUOTATION_TAX_RATE: 18
      QUOTATION_VALIDITY_DAYS: 30
      QUOTATION_HIGH_VALUE_THRESHOLD: 100000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run migrate --workspace server

      - name: Seed test database
        run: npm run seed --workspace server

      - name: Run backend automated tests
        run: npm test --workspace server

      - name: Build frontend production bundle
        run: npm run build --workspace client
        env:
          VITE_API_URL: http://localhost:4000/api

  docker-build:
    name: Validate Backend Docker Build
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Backend Docker Image
        run: docker build -t forgequote-backend:ci ./server

      - name: Smoke test Backend container startup & health endpoint
        run: |
          docker run -d --name backend-smoke -p 4000:4000 \
            -e NODE_ENV=production \
            -e PORT=4000 \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/forgequote \
            -e JWT_SECRET=ci-validation-jwt-secret-at-least-32-characters \
            forgequote-backend:ci
          sleep 5
          curl --fail --retry 5 --retry-delay 2 http://localhost:4000/api/health
          docker stop backend-smoke

